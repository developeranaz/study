<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civil Engineering Question Bank</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
        <h1>📐 Civil Engineering Q-Bank</h1>
      </div>
      <div class="header-meta">
        <span id="progress-label">0 / 0 answered</span>
        <button id="clear-btn" title="Clear all saved answers">🗑 Clear Progress</button>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-content">
      <div class="sidebar-title">Subjects</div>
      <ul id="subject-list"></ul>
    </div>
    <div class="sidebar-footer">
      <button id="export-btn" class="hidden" title="Export all questions with your answers to JSON">📤 Export Answers</button>
    </div>
  </aside>

  <!-- SIDEBAR RESIZER -->
  <div id="sidebar-resizer" class="resizer" title="Drag to resize, double-click to toggle">
    <div class="resizer-handle"></div>
  </div>

  <!-- MAIN AREA -->
  <main id="main">
    <!-- Subject header shown above question list -->
    <div id="subject-header" class="subject-header hidden">
      <div class="subject-header-left">
        <h2 id="subject-title"></h2>
        <span id="subject-count"></span>
      </div>
      <div class="subject-progress-bar-wrap">
        <div class="subject-progress-bar" id="subject-progress-bar"></div>
      </div>
      <span id="subject-progress-label"></span>
    </div>

    <!-- Question list renders here -->
    <div id="question-list"></div>

    <!-- Landing/empty state -->
    <div id="landing">
      <div class="landing-icon">📖</div>
      <h2>Select a subject to begin</h2>
      <p>Your answers are saved automatically in cookies.<br>Progress survives tab closes and browser restarts.</p>
      <div id="overall-stats"></div>
    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast"></div>

  <!-- CLEAR CONFIRM MODAL -->
  <div id="modal-overlay" class="hidden">
    <div class="modal">
      <h3>Clear all progress?</h3>
      <p>This will erase all saved answers across all subjects.</p>
      <div class="modal-btns">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Yes, clear it</button>
      </div>
    </div>
  </div>

  <!-- KaTeX JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- Auto-render Extension -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
